<body>

<div class="layout">

  <div class="container">
    <h1>Test IQ Simplu</h1>

    <div id="quiz">
      <div class="question" id="question">Se încarcă...</div>
      <div id="answers"></div>
    </div>

    <div class="result" id="result"></div>
  </div>

  <!-- RECLAMĂ -->
  <div class="ad">
    <div id="div-gpt-ad-1778340582034-0" style="width:100%;min-height:250px;">
      <script>
        window.googletag = window.googletag || { cmd: [] };
        googletag.cmd.push(function () {
          googletag.display('div-gpt-ad-1778340582034-0');
        });
      </script>
    </div>
  </div>

</div>

<script>
const questions=[
  {q:"2,4,8,16,?",a:["18","24","32","20"],correct:2},
  {q:"A,C,E,G,?",a:["H","I","J","K"],correct:1},
  {q:"3 mere - 1 măr = ?",a:["1","2","3","0"],correct:1},
  {q:"Inversul lui 10?",a:["-10","0","1/10","10"],correct:0},
  {q:"Care nu se potrivește?",a:["cerc","pătrat","triunghi","măr"],correct:3},
  {q:"1,1,2,3,5,?",a:["6","7","8","10"],correct:1},
  {q:"10,20,30,40,?",a:["45","50","60","55"],correct:1},
  {q:"9,12,15,18,?",a:["19","20","21","22"],correct:2},
  {q:"Z,X,V,T,?",a:["R","S","P","Q"],correct:2},
  {q:"4+4=?",a:["16","24","32","20"],correct:1}
];

let current=0,score=0;

function startGame(){current=0;score=0;loadQuestion();}

function loadQuestion(){
  const qEl=document.getElementById("question");
  const aEl=document.getElementById("answers");
  const rEl=document.getElementById("result");

  if(current>=questions.length){
    document.getElementById("quiz").style.display="none";
    rEl.innerText="Final! Scor: "+score+" / "+questions.length;
    return;
  }

  const q=questions[current];
  qEl.innerText=q.q;
  aEl.innerHTML="";

  q.a.forEach((ans,i)=>{
    const btn=document.createElement("button");
    btn.innerText=ans;
    btn.onclick=()=>{
      if(i===q.correct)score++;
      current++;
      loadQuestion();
    };
    aEl.appendChild(btn);
  });
}

document.addEventListener("DOMContentLoaded",startGame);
</script>

</body>
