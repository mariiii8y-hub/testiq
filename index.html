<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Test IQ Simplu</title>

  <!-- ADSENSE -->
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-8428894175274212"
     crossorigin="anonymous"></script>

  <style>
    body{
      margin:0;
      font-family:Arial;
      background:#f4f4f4;
    }

    .wrap{
      display:flex;
      flex-direction:column;
      align-items:center;
      min-height:100vh;
      gap:10px;
      padding:10px;
    }

    .box{
      width:100%;
      max-width:500px;
      background:white;
      padding:20px;
      border-radius:12px;
      box-shadow:0 4px 10px rgba(0,0,0,0.1);
    }

    .ad{
      width:100%;
      max-width:500px;
      min-height:250px;
      background:#eee;
      display:flex;
      align-items:center;
      justify-content:center;
      border-radius:8px;
      overflow:hidden;
    }

    h1{text-align:center;font-size:20px;}

    .q{
      text-align:center;
      font-size:18px;
      margin:15px 0;
    }

    button{
      width:100%;
      margin:6px 0;
      padding:12px;
      border:none;
      border-radius:10px;
      background:#007bff;
      color:white;
      font-size:16px;
    }

    .result{
      text-align:center;
      margin-top:15px;
      font-size:18px;
    }
  </style>
</head>

<body>

<div class="wrap">

  <div class="box">
    <h1>Test IQ Simplu</h1>

    <div id="quiz">
      <div class="q" id="question">Se încarcă...</div>
      <div id="answers"></div>
    </div>

    <div class="result" id="result"></div>
  </div>

  <!-- RECLAMĂ ADSENSE -->
  <div class="ad">

    <ins class="adsbygoogle"
         style="display:block"
         data-ad-client="ca-pub-8428894175274212"
         data-ad-slot="7255165912"
         data-ad-format="auto"
         data-full-width-responsive="true"></ins>

    <script>
         (adsbygoogle = window.adsbygoogle || []).push({});
    </script>

  </div>

</div>

<script>
const questions=[
  {q:"2,4,8,16,?",a:["18","24","32","20"],c:2},
  {q:"A,C,E,G,?",a:["H","I","J","K"],c:1},
  {q:"3-1=?",a:["1","2","3","0"],c:1},
  {q:"Inversul lui 10?",a:["-10","0","1/10","10"],c:0},
  {q:"Care nu se potrivește?",a:["cerc","pătrat","triunghi","măr"],c:3},
  {q:"1,1,2,3,5,?",a:["6","7","8","10"],c:1},
  {q:"10,20,30,40,?",a:["45","50","60","55"],c:1},
  {q:"9,12,15,18,?",a:["19","20","21","22"],c:2},
  {q:"Z,X,V,T,?",a:["R","S","P","Q"],c:2},
  {q:"4+4=?",a:["16","24","32","20"],c:1}
];

let i=0,score=0;

function load(){
  let q=document.getElementById("question");
  let a=document.getElementById("answers");
  let r=document.getElementById("result");

  if(i>=questions.length){
    document.getElementById("quiz").style.display="none";
    r.innerText="Final! Scor: "+score+"/"+questions.length;
    return;
  }

  let cur=questions[i];
  q.innerText=cur.q;
  a.innerHTML="";

  cur.a.forEach((x,idx)=>{
    let b=document.createElement("button");
    b.innerText=x;
    b.onclick=()=>{
      if(idx===cur.c)score++;
      i++;
      load();
    };
    a.appendChild(b);
  });
}

document.addEventListener("DOMContentLoaded",load);
</script>

</body>
</html>
